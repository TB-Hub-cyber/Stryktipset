name: Hämta stryktipsomgång

on:
  schedule:
    # Var tredje timme i vanliga fall.
    - cron: "0 */3 * * *"
    # Varje timme fredag, lördag och söndag, när oddsen rör sig mest.
    - cron: "0 * * * 5,6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamta-data
  cancel-in-progress: true

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Hämta omgången från Svenska Spel
        run: |
          curl -sS -f \
            -H "User-Agent: stryktips-hobbyprojekt" \
            -H "Accept: application/json" \
            "https://api.spela.svenskaspel.se/draw/1/stryktipset/draws" \
            -o raw.json

          jq empty raw.json

          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fetchedAt: $t, draw: .}' raw.json > data.json

          rm raw.json

      - name: Hämta tabeller och resultat från football-data.org
        continue-on-error: true
        env:
          FD: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          # Gratisnivån tillåter tio anrop per minut, därav pauserna.
          for code in PL ELC; do
            curl -sS -f -H "X-Auth-Token: $FD" \
              "https://api.football-data.org/v4/competitions/$code/standings" \
              -o "st-$code.json"
            sleep 7

            curl -sS -f -H "X-Auth-Token: $FD" \
              "https://api.football-data.org/v4/competitions/$code/matches?status=FINISHED" \
              -o "ma-$code.json"
            sleep 7
          done

          jq empty st-PL.json st-ELC.json ma-PL.json ma-ELC.json

          # Behåll bara det formuträkningen behöver, annars växer filen i onödan.
          for code in PL ELC; do
            jq '[.matches[]
                 | select(.score.fullTime.home != null)
                 | {d: .utcDate,
                    h: .homeTeam.id, a: .awayTeam.id,
                    hg: .score.fullTime.home, ag: .score.fullTime.away}]' \
              "ma-$code.json" > "sm-$code.json"
          done

          jq -n \
            --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile stpl  st-PL.json \
            --slurpfile stelc st-ELC.json \
            --slurpfile mapl  sm-PL.json \
            --slurpfile maelc sm-ELC.json \
            '{fetchedAt: $t,
              competitions: {PL: $stpl[0], ELC: $stelc[0]},
              results:      {PL: $mapl[0], ELC: $maelc[0]}}' \
            > football.json

          rm st-*.json ma-*.json sm-*.json

      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add data.json || true
          git add football.json || true

          if git diff --staged --quiet; then
            echo "Ingen förändring sedan förra hämtningen."
          else
            git commit -m "Uppdaterad omgångs- och tabelldata"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
