name: Hämta stryktipsomgång

on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "0 * * * 5,6,0"
    # Sista mätningen före stopp. Tiderna är UTC — 13:50 är 15:50 svensk
    # sommartid, 14:50 är 15:50 vintertid. Den som inte gäller för dagen
    # hämtar bara data i onödan.
    - cron: "50 13 * * 6"
    - cron: "50 14 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamta-data
  cancel-in-progress: true

env:
  TRIM: >-
    [.matches[]
     | select(.score.fullTime.home != null)
     | {d: .utcDate,
        c: $c,
        md: .matchday,
        h: .homeTeam.id, a: .awayTeam.id,
        hn: (.homeTeam.shortName // .homeTeam.name),
        an: (.awayTeam.shortName // .awayTeam.name),
        hg: .score.fullTime.home, ag: .score.fullTime.away,
        hh: .score.halfTime.home, ah: .score.halfTime.away}]

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Hämta omgången från Svenska Spel
        run: |
          curl -sS -f \
            -H "User-Agent: stryktips-hobbyprojekt" \
            -H "Accept: application/json" \
            "https://api.spela.svenskaspel.se/draw/1/stryktipset/draws" \
            -o raw.json

          jq empty raw.json

          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fetchedAt: $t, draw: .}' raw.json > data.json

          rm raw.json

      - name: Spara ögonblicksbild i historiken
        run: python3 .github/scripts/history.py

      - name: Rätta inlämnade rader
        continue-on-error: true
        run: python3 .github/scripts/results.py

      - name: Avgör vilka ligor som behövs
        id: leagues
        run: echo "codes=$(python3 .github/scripts/leagues.py)" >> "$GITHUB_OUTPUT"

      - name: Hämta tabeller och resultat
        continue-on-error: true
        env:
          FD: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CODES: ${{ steps.leagues.outputs.codes }}
        run: |
          for code in $CODES; do
            curl -sS -f -H "X-Auth-Token: $FD" \
              "https://api.football-data.org/v4/competitions/$code/standings" \
              -o "st-$code.json" || { echo "Tabell för $code misslyckades."; continue; }
            sleep 7

            curl -sS -f -H "X-Auth-Token: $FD" \
              "https://api.football-data.org/v4/competitions/$code/matches?status=FINISHED" \
              -o "ma-$code.json" || { echo "Matcher för $code misslyckades."; continue; }
            sleep 7

            jq --arg c "$code" "$TRIM" "ma-$code.json" > "sm-$code.json"
          done

      - name: Försök hämta tidigare säsonger
        continue-on-error: true
        env:
          FD: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CODES: ${{ steps.leagues.outputs.codes }}
        run: |
          for season in 2025 2024; do
            for code in $CODES; do
              if curl -sS -f -H "X-Auth-Token: $FD" \
                   "https://api.football-data.org/v4/competitions/$code/matches?status=FINISHED&season=$season" \
                   -o "old-$code-$season.json"; then
                jq --arg c "$code" "$TRIM" "old-$code-$season.json" > "po-$code-$season.json"
              else
                echo "Säsong $season för $code nekades eller saknas."
              fi
              sleep 7
            done
          done

      - name: Sätt ihop football.json
        continue-on-error: true
        env:
          CODES: ${{ steps.leagues.outputs.codes }}
        run: |
          python3 - "$CODES" << 'PY'
          import glob, json, os, sys, datetime

          codes = sys.argv[1].split()

          def load(path, fallback):
              if not os.path.exists(path):
                  return fallback
              try:
                  with open(path, encoding="utf-8") as fh:
                      return json.load(fh)
              except (ValueError, OSError):
                  return fallback

          competitions = {}
          results = {}
          for code in codes:
              standings = load("st-%s.json" % code, None)
              if standings:
                  competitions[code] = standings
              results[code] = load("sm-%s.json" % code, [])

          past = []
          for path in sorted(glob.glob("po-*.json")):
              past.extend(load(path, []))

          out = {
              "fetchedAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "competitions": competitions,
              "results": results,
              "past": past,
          }
          with open("football.json", "w", encoding="utf-8") as fh:
              json.dump(out, fh, ensure_ascii=False, separators=(",", ":"))

          print("Ligor: %s" % ", ".join(sorted(competitions)))
          print("Matcher denna säsong: %d" % sum(len(v) for v in results.values()))
          print("Tidigare möten: %d" % len(past))
          PY

          rm -f st-*.json ma-*.json sm-*.json old-*.json po-*.json

      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add data.json || true
          git add football.json || true
          git add history.json || true
          git add rows.json || true

          if git diff --staged --quiet; then
            echo "Ingen förändring sedan förra hämtningen."
          else
            git commit -m "Uppdaterad omgångs- och tabelldata"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
