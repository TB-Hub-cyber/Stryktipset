name: Hämta stryktipsomgång

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Hämta omgången från Svenska Spel
        run: |
          curl -sS -f \
            -H "User-Agent: stryktips-hobbyprojekt" \
            -H "Accept: application/json" \
            "https://api.spela.svenskaspel.se/draw/1/stryktipset/draws" \
            -o raw.json
          jq empty raw.json
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fetchedAt: $t, draw: .}' raw.json > data.json
          rm raw.json

      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Ingen förändring sedan förra hämtningen."
          else
            git commit -m "Uppdaterad omgångsdata"
            git push
          fi
