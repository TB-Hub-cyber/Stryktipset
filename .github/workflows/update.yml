name: Hämta stryktipsomgång

on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "0 * * * 5,6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamta-data
  cancel-in-progress: true

env:
  # Trimmar ner en matchlista till bara det appen behöver.
  TRIM: >-
    [.matches[]
     | select(.score.fullTime.home != null)
     | {d: .utcDate,
        c: $c,
        md: .matchday,
        h: .homeTeam.id, a: .awayTeam.id,
        hn: (.homeTeam.shortName // .homeTeam.name),
        an: (.awayTeam.shortName // .awayTeam.name),
        hg: .score.fullTime.home, ag: .score.fullTime.away,
        hh: .score.halfTime.home, ah: .score.halfTime.away}]

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Hämta omgången från Svenska Spel
        run: |
          curl -sS -f \
            -H "User-Agent: stryktips-hobbyprojekt" \
            -H "Accept: application/json" \
            "https://api.spela.svenskaspel.se/draw/1/stryktipset/draws" \
            -o raw.json

          jq empty raw.json

          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fetchedAt: $t, draw: .}' raw.json > data.json

          rm raw.json

      - name: Spara ögonblicksbild i historiken
        run: python3 .github/scripts/history.py

      - name: Hämta tabeller och resultat
        continue-on-error: true
        env:
          FD: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          for code in PL ELC; do
            curl -sS -f -H "X-Auth-Token: $FD" \
              "https://api.football-data.org/v4/competitions/$code/standings" \
              -o "st-$code.json"
            sleep 7

            curl -sS -f -H "X-Auth-Token: $FD" \
              "https://api.football-data.org/v4/competitions/$code/matches?status=FINISHED" \
              -o "ma-$code.json"
            sleep 7
          done

          jq empty st-PL.json st-ELC.json ma-PL.json ma-ELC.json

          for code in PL ELC; do
            jq --arg c "$code" "$TRIM" "ma-$code.json" > "sm-$code.json"
          done

      # Egen steg eftersom gratisnivån kan neka historiska säsonger.
      # Misslyckas den här delen får du ändå allt annat.
      - name: Försök hämta tidigare säsonger
        continue-on-error: true
        id: past
        env:
          FD: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          ok=1
          for season in 2025 2024; do
            for code in PL ELC; do
              if curl -sS -f -H "X-Auth-Token: $FD" \
                   "https://api.football-data.org/v4/competitions/$code/matches?status=FINISHED&season=$season" \
                   -o "old-$code-$season.json"; then
                jq --arg c "$code" "$TRIM" "old-$code-$season.json" > "po-$code-$season.json"
              else
                echo "Säsong $season för $code nekades eller saknas."
                ok=0
              fi
              sleep 7
            done
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Sätt ihop football.json
        continue-on-error: true
        run: |
          # Saknade filer ersätts med tomma listor så sammanslagningen alltid går igenom.
          for f in po-PL-2025 po-ELC-2025 po-PL-2024 po-ELC-2024; do
            [ -f "$f.json" ] || echo "[]" > "$f.json"
          done

          jq -n \
            --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile stpl  st-PL.json \
            --slurpfile stelc st-ELC.json \
            --slurpfile mapl  sm-PL.json \
            --slurpfile maelc sm-ELC.json \
            --slurpfile p1 po-PL-2025.json \
            --slurpfile p2 po-ELC-2025.json \
            --slurpfile p3 po-PL-2024.json \
            --slurpfile p4 po-ELC-2024.json \
            '{fetchedAt: $t,
              competitions: {PL: $stpl[0], ELC: $stelc[0]},
              results:      {PL: $mapl[0], ELC: $maelc[0]},
              past:         ($p1[0] + $p2[0] + $p3[0] + $p4[0])}' \
            > football.json

          rm -f st-*.json ma-*.json sm-*.json old-*.json po-*.json
          echo "Tidigare möten i filen: $(jq '.past | length' football.json)"

      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add data.json || true
          git add football.json || true
          git add history.json || true

          if git diff --staged --quiet; then
            echo "Ingen förändring sedan förra hämtningen."
          else
            git commit -m "Uppdaterad omgångs- och tabelldata"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
